name: Robot Finca Akila (clima y noticias)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/robot.mjs
      - name: Guardar cambios
        run: |
          git config user.name "robot-finca-akila"
          git config user.email "robot@users.noreply.github.com"
          git add data/hoy.json
          git diff --cached --quiet || (git commit -m "Robot: clima y noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')" && git pull --rebase && git push)
